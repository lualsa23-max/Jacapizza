<!DOCTYPE html>
<html lang="es">
<head>
{% include "_head.html" %}
  <title>JacaPizza — Ingresar</title>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <h1 class="wordmark">JacaPizza</h1>
    </div>
    <div class="login-card">
      {% if error %}
      <div class="login-err">{{ icono('alerta', 18) }} {{ error }}</div>
      {% endif %}
      <form method="post">
        <div class="form-group">
          <label class="form-label">Usuario</label>
          <input class="form-input" type="text" name="usuario"
                 autocomplete="username" autocapitalize="none"
                 autofocus placeholder="ej: mesero1">
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label class="form-label">Contraseña</label>
          <input class="form-input" type="password" name="password"
                 autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">
          Ingresar →
        </button>
      </form>
    </div>
  </div>
</div>
<div class="pivota-pie">
  {% include "_pivota.html" %}
</div>
</body>
</html>
